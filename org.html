<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="icon.png">
  <title>静岡大学吹奏楽団 広報係 HP 組織図</title>

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&display=swap">

  <!-- 共通デザイン -->
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="common.css">

  <!-- 組織図ページ専用 -->
  <link rel="stylesheet" href="org.css">

  <script src="common.js" defer></script>
  <script src="org.js" defer></script>
</head>

<body>
  <!-- ナビ・フッター・背景パーティクルは common.js が差し込みます -->
  <main class="page-main">
    <div class="page-header-box">
      <h1>組織図</h1>
      <p>広報係の組織図についてまとめたページです。</p>
    </div>

    <!-- 部署・メンバー・仕事は site_data.json の organization から org.js が作ります -->
    <div class="dept-list" id="org-chart"></div>
  </main>

  <!-- 仕事の詳細（モーダル） -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button type="button" class="close" aria-label="閉じる">&times;</button>
      <div id="modal-text"></div>
    </div>
  </div>
</body>
</html>
