<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="icon.png">
  <title>静岡大学吹奏楽団 広報係 HP スケジュール</title>

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&display=swap">

  <!-- 共通デザイン -->
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="common.css">

  <!-- スケジュールページ専用 -->
  <link rel="stylesheet" href="schedule.css">

  <script src="common.js" defer></script>
  <script src="schedule.js" defer></script>
</head>

<body>
  <!-- ナビ・フッター・背景パーティクルは common.js が差し込みます -->
  <main class="page-main">
    <div class="page-header-box">
      <h1>スケジュール</h1>
      <p>仕事スケジュールについてまとめたページです。</p>
    </div>

    <section class="schedule-section">
      <div id="event-selector-area">
        <label for="event-select">イベントを選択：</label>
        <select id="event-select">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <div id="event-summary"></div>
      <div id="department-filter"></div>
      <div id="schedule-status" role="status"></div>
      <div id="task-list"></div>
    </section>
  </main>
</body>
</html>
